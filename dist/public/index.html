<body style="background: linear-gradient(135deg, #1e3a8a 0%, #3b2fad 35%, #6d28d9 70%, #7c3aed 100%); margin: 0; padding: 0; min-height: 100vh;">
  <div id="root">
    <div id="spotly-preloader" style="position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a8a 0%, #3b2fad 35%, #6d28d9 70%, #7c3aed 100%); overflow: hidden; user-select: none; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <!-- Ambient background glow orbs -->
      <div style="position: absolute; top: -10%; right: -10%; width: 320px; height: 320px; background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, transparent 70%); border-radius: 50%; filter: blur(40px); pointer-events: none;"></div>
      <div style="position: absolute; bottom: -10%; left: -10%; width: 320px; height: 320px; background: radial-gradient(circle, rgba(59, 47, 173, 0.3) 0%, transparent 70%); border-radius: 50%; filter: blur(40px); pointer-events: none;"></div>

      <!-- Center Content: Small Logo + Circle Animation only -->
      <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
        <!-- Small Spotly Logo with smooth breathing pulse -->
        <div style="animation: spotlyLogoPulse 1.8s ease-in-out infinite;">
          <img src="/images/spotly-logo-white.png" alt="Spotly" style="height: 32px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 12px rgba(0,0,0,0.3));" onerror="this.onerror=null; this.src='/spotly-icon.png';" />
        </div>

        <!-- Clean Circle Animation Spinner -->
        <div style="position: relative; width: 32px; height: 32px;">
          <div style="position: absolute; inset: 0; border: 2.5px solid rgba(255, 255, 255, 0.2); border-radius: 50%;"></div>
          <div style="position: absolute; inset: 0; border: 2.5px solid transparent; border-top-color: #ffffff; border-right-color: rgba(255, 255, 255, 0.85); border-radius: 50%; animation: spotlySpin 0.8s linear infinite;"></div>
        </div>
      </div>

      <style>
        @keyframes spotlySpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes spotlyLogoPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.025); opacity: 0.96; }
        }
      </style>
    </div>
  </div>
